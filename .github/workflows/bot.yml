name: Lichess Bot Runner
run: |
  sed -i 's/token: ""/token: "${{ secrets.LICHESS_TOKEN }}"/' config.yml
on:
  schedule:
    - cron: '0 */5 * * *' # Triggers every 5 hours
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Bot
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
        run: timeout 5h python lichess-bot.py || true